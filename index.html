function sc(t){t=String(t==null?"":t).replace(/\s+/g," ").trim();if(!t)return t;

 if(flat&&L.length>1)t=t.replace(/[A-Za-z0-9.]+/g,w=>{const l=w.toLowerCase();if(/^\d/.test(w)){const m=l.match(/^(\d+(?:\.\d+)?)([a-z]+)$/);return m&&UNITS[m[2]]?m[1]+UNITS[m[2]]:w}if(ACR.has(l))return l.toUpperCase();return w.length==1?w:l}).replace(/-([a-z])\b/g,(m,c)=>"-"+c.toUpperCase());

function suggest(inp,getItems,onPick,minChars){

let IV={open:false,lines:[{d:"",q:1,p:""}]},IVQ="";
function invCalc(i){const sub=i.lines.reduce((a,l)=>a+(+l.q||0)*(+l.p||0),0),tot=Math.max(0,sub-(+i.disc||0));let paid=0;
 if(i.src=="hire"){const h=S.pa.hires.find(x=>x.id==i.ref);paid=h?Math.min(tot,hPaid(h)):0}
 else if(i.src=="sale"){const e=S.debt.find(x=>x.bid==i.ref);paid=e?Math.min(tot,dpaid(e)):tot}
 else paid=Math.min(tot,(i.pays||[]).reduce((a,p)=>a+p.a,0));
 return{sub,tot,paid,bal:Math.max(0,tot-paid)}}
const invSt=c=>c.tot>0&&c.bal<=0?["PAID","paid","ok"]:c.paid>0?["PART PAID","part","low"]:["UNPAID","unpaid","out"];
function newInvNo(){S.set.invN=(+S.set.invN||0)+1;return"INV-"+String(S.set.invN).padStart(4,"0")}
function invFromHire(h){ens();let i=S.invoices.find(x=>x.src=="hire"&&x.ref==h.id);const desc="P.A equipment hire"+(h.event?" – "+h.event:"")+" ("+h.lines.map(l=>l.name+" ×"+l.q).join(", ")+")"+(h.date?", "+fd(h.date):"");
 if(!i){i={id:uid("V"),no:newInvNo(),t:Date.now(),date:day(),due:"",cust:h.cust,phone:h.phone||"",addr:"",lines:[],disc:0,note:"",src:"hire",ref:h.id,pays:[]};S.invoices.push(i)}
 i.lines=[{d:desc,q:1,p:+h.charge||0}];i.cust=h.cust;i.phone=h.phone||i.phone;save();showInv(i.id)}
function saleBills(){const by={};S.sales.forEach(s=>{const k=s.bid||("S"+s.t);(by[k]=by[k]||{k,t:s.t,date:s.date,cust:s.cust,lines:[],total:0}).lines.push(s);by[k].total+=s.total});return Object.values(by).sort((a,b)=>b.t-a.t)}
function invFromSale(k){ens();const b=saleBills().find(x=>x.k==k);if(!b)return;let i=S.invoices.find(x=>x.src=="sale"&&x.ref==k);
 if(!i){i={id:uid("V"),no:newInvNo(),t:Date.now(),date:b.date,due:"",cust:b.cust||"Walk-in customer",phone:((S.cust[(b.cust||"").toLowerCase()]||{}).phone)||"",addr:"",lines:b.lines.map(s=>({d:s.name,q:s.qty,p:s.qty?+(s.total/s.qty).toFixed(2):s.total})),disc:0,note:"",src:"sale",ref:k,pays:[]};S.invoices.push(i);save()}showInv(i.id)}
function invRows(){const q=IVQ.trim().toLowerCase(),L=S.invoices.slice().sort((a,b)=>b.t-a.t).filter(i=>!q||(i.no+" "+i.cust).toLowerCase().includes(q));
 if(!L.length)return'<p class="mu">No invoices yet. Tap “New invoice” to make one.</p>';
 return`<div class="scroll"><table><tr><th>No.</th><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr>${L.map(i=>{const c=invCalc(i),s=invSt(c);return`<tr><td><b>${E(i.no)}</b></td><td>${fd(i.date)}</td><td>${E(i.cust)}</td><td>${M(c.tot)}</td><td>${M(c.paid)}</td><td>${c.bal>0?`<b class="out">${M(c.bal)}</b>`:"-"}</td><td><span class="pill ${s[2]}">${s[0]}</span></td><td><button class="ib" data-iv="view" data-id="${i.id}">👁 View / Print</button> ${c.bal>0?`<button class="ib" data-iv="pay" data-id="${i.id}">💰 Pay</button>`:""} <button class="ib" data-iv="del" data-id="${i.id}">🗑</button></td></tr>`}).join("")}</table></div>`}
function ivLinesHTML(){return IV.lines.map((l,i)=>`<div class="sx-ln"><input data-ld="${i}" placeholder="Item or service" value="${E(l.d)}" style="flex:3;min-width:160px"><input data-lq="${i}" type="number" min="0" step="any" value="${l.q}" style="width:80px;flex:none" aria-label="Quantity"><input data-lp="${i}" type="number" min="0" step="any" placeholder="Price each" value="${E(l.p)}" style="width:120px;flex:none"><button class="ib" type="button" data-lx="${i}">✕</button></div>`).join("")}
function invView(v){ens();const all=S.invoices.map(invCalc),tot=all.reduce((a,c)=>a+c.tot,0),paid=all.reduce((a,c)=>a+c.paid,0),bills=saleBills().slice(0,25);
 v.innerHTML=`<div class="kpis"><div class="k"><span>Total invoiced</span><b>${M(tot)}</b><small>${S.invoices.length} invoice${S.invoices.length==1?"":"s"}</small></div><div class="k"><span>Paid</span><b>${M(paid)}</b></div><div class="k"><span>Still unpaid</span><b>${M(tot-paid)}</b></div></div>
 <div class="panel"><div class="tb" style="justify-content:space-between"><h2 style="margin:0">🧾 Invoices</h2><button class="p" id="ivn" type="button">${IV.open?"✕ Close form":"＋ New invoice"}</button></div>
 <p class="mu" style="margin:6px 0 0">Invoices use your payment options from Shop Settings, in a Safaricom green theme. Print them or save as PDF.</p>
 <div class="sx-row" style="margin-top:6px"><label>Make an invoice from a P.A hire<select id="ivh"><option value="">Choose a hire…</option>${S.pa.hires.slice().sort((a,b)=>b.t-a.t).map(h=>`<option value="${h.id}">${E(h.cust)} · ${E(h.event||h.lines.map(l=>l.name).join(", "))} · ${M(h.charge)}</option>`).join("")}</select></label><label>…or from a recorded sale<select id="ivs"><option value="">Choose a sale…</option>${bills.map(b=>`<option value="${E(b.k)}">${fd(b.date)} · ${E(b.cust||"Walk-in")} · ${M(b.total)}</option>`).join("")}</select></label></div></div>
 ${IV.open?`<div class="panel"><h2>New invoice</h2><div class="sx-row"><label>Customer name<input id="ic" list="cdlx" autocomplete="off"></label><label>Phone<input id="ip" type="tel"></label></div>${custList()}<label>Address or reference (optional)<input id="ia"></label><div class="sx-row"><label>Date<input id="id" type="date" value="${day()}"></label><label>Due date (optional)<input id="iu" type="date"></label></div>
 <label>Items</label><div id="ivl">${ivLinesHTML()}</div><div class="sx-row"><button class="ib" id="ila" type="button">＋ Add line</button><label>Or add from stock<input id="ivq" placeholder="Search stock item to add" autocomplete="off"></label></div><div id="ivr"></div>
 <div class="sx-row"><label>Discount (KES, optional)<input id="idc" type="number" min="0" step="any"></label><label>Note on invoice (optional)<input id="in"></label></div><div id="ivm"></div><button class="p big" id="ivsv" type="button" style="margin-top:12px;width:100%">✔ Create invoice</button></div>`:""}
 <div class="panel"><div class="tb"><input id="ivf" placeholder="Search invoice number or customer" value="${E(IVQ)}"></div><div id="ivt" style="margin-top:10px">${invRows()}</div></div>`;
 bindInv2()}
function bindInv2(){const T=()=>{G("ivt").innerHTML=invRows();bindIvT()};
 G("ivn").onclick=()=>{IV.open=!IV.open;if(IV.open)IV.lines=[{d:"",q:1,p:""}];draw()};
 G("ivf").oninput=()=>{IVQ=G("ivf").value;T()};
 G("ivh").onchange=()=>{const h=S.pa.hires.find(x=>x.id==G("ivh").value);if(h)invFromHire(h)};G("ivs").onchange=()=>{if(G("ivs").value)invFromSale(G("ivs").value)};
 if(IV.open){const L=()=>{G("ivl").innerHTML=ivLinesHTML();bindLn()},bindLn=()=>{document.querySelectorAll("[data-ld]").forEach(e=>e.oninput=()=>IV.lines[+e.dataset.ld].d=e.value);document.querySelectorAll("[data-lq]").forEach(e=>e.oninput=()=>IV.lines[+e.dataset.lq].q=e.value);document.querySelectorAll("[data-lp]").forEach(e=>e.oninput=()=>IV.lines[+e.dataset.lp].p=e.value);document.querySelectorAll("[data-lx]").forEach(e=>e.onclick=()=>{IV.lines.splice(+e.dataset.lx,1);if(!IV.lines.length)IV.lines=[{d:"",q:1,p:""}];L()})};bindLn();
  G("ila").onclick=()=>{IV.lines.push({d:"",q:1,p:""});L()};
  G("ic").onchange=()=>{const c=S.cust[G("ic").value.trim().toLowerCase()];if(c&&c.phone)G("ip").value=c.phone};
  G("ivq").oninput=()=>{const t=G("ivq").value.trim().toLowerCase(),r=G("ivr");if(!t){r.innerHTML="";return}const f=S.inv.filter(p=>matchQ(p,t)).slice(0,6);r.innerHTML=f.length?f.map(p=>`<div class="sx-ln"><b>${E(tn(p))}</b><span class="mu">${M(p.price||0)}</span><button class="ib" type="button" data-ia="${E(p.sku)}">＋ Add</button></div>`).join(""):'<p class="mu">No stock item matches.</p>';r.querySelectorAll("[data-ia]").forEach(b=>b.onclick=()=>{const p=S.inv.find(x=>x.sku==b.dataset.ia);if(!p)return;if(IV.lines.length==1&&!IV.lines[0].d&&!IV.lines[0].p)IV.lines=[];IV.lines.push({d:tn(p),q:1,p:p.price||""});G("ivq").value="";r.innerHTML="";L()})};
  G("ivsv").onclick=()=>{const cust=G("ic").value.trim(),ln=IV.lines.filter(l=>l.d.trim()&&(+l.p||0)>0&&(+l.q||0)>0),m=G("ivm");if(!cust){m.innerHTML='<div class="msg e">Enter the customer name.</div>';return}if(!ln.length){m.innerHTML='<div class="msg e">Add at least one item with a quantity and a price.</div>';return}
   const i={id:uid("V"),no:newInvNo(),t:Date.now(),date:G("id").value||day(),due:G("iu").value,cust,phone:G("ip").value.trim(),addr:G("ia").value.trim(),lines:ln.map(l=>({d:l.d.trim(),q:+l.q,p:+l.p})),disc:Math.max(0,+G("idc").value||0),note:G("in").value.trim(),src:"manual",ref:"",pays:[]};
   S.invoices.push(i);rememberCust(cust,i.phone);IV.open=false;save();draw();showInv(i.id)}}
 bindIvT()}
function bindIvT(){document.querySelectorAll("#ivt [data-iv]").forEach(b=>b.onclick=()=>{const i=S.invoices.find(x=>x.id==b.dataset.id);if(!i)return;const a=b.dataset.iv;if(a=="view")showInv(i.id);else if(a=="pay")ivPay(i);else if(a=="del"&&confirm("Delete invoice "+i.no+"? "+(i.src=="manual"&&(i.pays||[]).length?"Payments recorded on it will also disappear from Money Received.":""))){S.invoices=S.invoices.filter(x=>x!==i);save();draw()}})}
function ivPay(i){if(i.src=="hire"){const h=S.pa.hires.find(x=>x.id==i.ref);if(h)return hpayDlg(h);return toast("The hire for this invoice was deleted")}
 if(i.src=="sale")return toast("This invoice follows the sale. Use Customer Debts to record the payment.");
 const c=invCalc(i),d=G("dg");d.innerHTML=`<h2 style="margin:0 0 4px">Payment for ${E(i.no)}</h2><div class="mu">${E(i.cust)} · balance ${M(c.bal)}</div><label>Amount received (KES)<input id="vp1" class="big" type="number" min="0" step="any" value="${c.bal}"></label><label>Paid with${mSel("vp2","M-Pesa")}</label><label>M-Pesa code (optional)<input id="vp3" autocomplete="off" style="text-transform:uppercase"></label><div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">${cancelBtn}<button class="p" id="vp4">Record payment</button></div>`;
 G("vp4").onclick=()=>{const a=Math.min(c.bal,+G("vp1").value||0);if(!(a>0))return toast("Enter the amount received");i.pays=i.pays||[];i.pays.push({d:Date.now(),a,m:G("vp2").value,code:G("vp3").value.trim().toUpperCase()});save();d.close();toast("Payment recorded");draw()};d.showModal();G("vp1").select()}

 if(p.till)o.push(`<div class="sfc-po"><b class="t">M-PESA Buy Goods (Till)</b><div class="big">${E(p.till)}</div>${p.mpname?`<div style="font-size:12.5px;color:#4b5563">Name: ${E(p.mpname)}</div>`:""}<ol><li>Go to M-PESA, Lipa na M-PESA, Buy Goods and Services</li><li>Till no: ${E(p.till)}</li><li>Amount: KES ${Math.round(c.bal).toLocaleString()}</li></ol></div>`);
 if(p.send)o.push(`<div class="sfc-po"><b class="t">M-PESA Send Money</b><div class="big">${E(p.send)}</div>${p.mpname?`<div style="font-size:12.5px;color:#4b5563">Name: ${E(p.mpname)}</div>`:""}<ol><li>Go to M-PESA, Send Money</li><li>Phone no: ${E(p.send)}</li><li>Amount: KES ${Math.round(c.bal).toLocaleString()}</li></ol></div>`);
 if(p.bank||p.bacc)o.push(`<div class="sfc-po"><b class="t">Bank transfer</b>${p.bank?`<div><b>${E(p.bank)}</b>${p.branch?" · "+E(p.branch):""}</div>`:""}${p.bacc?`<div class="big">${E(p.bacc)}</div>`:""}${p.bname?`<div style="font-size:12.5px;color:#4b5563">Account name: ${E(p.bname)}</div>`:""}</div>`);
 if(p.cash)o.push(`<div class="sfc-po"><b class="t">Cash</b><div>Cash payment is accepted at the shop.</div></div>`);

 S.debt.forEach(e=>(e.pays||[]).forEach((p,i)=>out.push({id:"D:"+e.id+":"+i,t:p.d,date:dstr(p.d),who:e.cust||"Customer",what:String(e.items||"Payment").replace(/^REPAIR: /,"Repair: ").slice(0,60)+(i==0&&e.bid?" (paid at sale)":" (debt payment)"),m:p.m,a:p.a,code:p.code||""})));
 S.rep.forEach(r=>{if(S.debt.some(e=>e.rid===r.id))return;const a=+r.paid||0;if(a>0){const dt=r.cd||r.rd||r.date||day();out.push({id:"R:"+r.id,t:Date.parse(dt+"T12:00:00")||0,date:dt,who:r.cust||"Customer",what:"Repair: "+(r.dev||""),m:"Repair desk",a,code:""})}});
 S.pa.hires.forEach(h=>(h.pays||[]).forEach((p,i)=>out.push({id:"H:"+h.id+":"+i,t:p.d,date:dstr(p.d),who:h.cust,what:"P.A hire"+(h.event?": "+h.event:""),m:p.m,a:p.a,code:p.code||""})));

 out.forEach(e=>{const x=ov[e.id];if(x){if(x.m)e.m=x.m;if(x.code!==undefined)e.code=x.code}e.m=nm(e.m)});

let MF={p:"today",from:"",to:"",m:"all",q:""};

 return`<div class="kpis"><div class="k"><span>Total received</span><b>${M(sum(all,"all"))}</b><small>${cnt("all")} payment${cnt("all")==1?"":"s"}</small></div><div class="k"><span>Cash</span><b>${M(sum(all,"Cash"))}</b><small>${cnt("Cash")} payment${cnt("Cash")==1?"":"s"}</small></div><div class="k"><span>M-Pesa</span><b>${M(sum(all,"M-Pesa"))}</b><small>${cnt("M-Pesa")} payment${cnt("M-Pesa")==1?"":"s"}</small></div><div class="k"><span>Bank</span><b>${M(sum(all,"Bank"))}</b></div>${un>0?`<div class="k"><span>Method not recorded</span><b>${M(un)}</b><small>Tap an entry below to set it</small></div>`:""}</div>
 <div class="panel"><h2>By day</h2>${Object.keys(days).length?`<div class="scroll"><table><tr><th>Date</th><th>Cash</th><th>M-Pesa</th><th>Bank</th><th>Total</th></tr>${Object.keys(days).sort().reverse().map(k=>{const d=days[k];return`<tr><td>${fd(k)}</td><td>${M(d.Cash)}</td><td>${M(d["M-Pesa"])}</td><td>${M(d.Bank+d.Unspecified)}</td><td><b>${M(d.t)}</b></td></tr>`}).join("")}</table></div>`:'<p class="mu">No money received in this period.</p>'}</div>
 <div class="panel"><h2>Every payment received</h2>${L.length?`<div class="scroll"><table><tr><th>Date</th><th>From</th><th>For</th><th>How paid</th><th>M-Pesa code</th><th>Amount</th><th></th></tr>${L.map(e=>`<tr><td>${fd(e.date)}</td><td>${E(e.who)}</td><td style="white-space:normal;min-width:160px">${E(e.what)}</td><td><span class="sx-tag ${mCls[e.m]}">${e.m}</span></td><td class="sx-code">${E(e.code||"")}</td><td><b>${M(e.a)}</b></td><td><button class="ib" data-le="${E(e.id)}">✎</button></td></tr>`).join("")}</table></div>`:'<p class="mu">Nothing matches.</p>'}</div>`}
